<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070f14">
  <title>TGN Global Golf - Spatial 3D PWA</title>
  <style>
    :root {
      --glass-bg: rgba(18, 32, 36, 0.88);
      --glass-border: rgba(114, 214, 150, 0.35);
      --accent: #4ade80;
      --accent-glow: rgba(74, 222, 128, 0.2);
      --gold: #facc15;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      color: var(--text-main);
      background: radial-gradient(circle at 50% 40%, rgba(20, 60, 40, 0.55), rgba(7, 15, 20, 0.96)),
                  url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(10, 20, 24, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
    }

    .logo { font-weight: 800; font-size: 1rem; cursor: pointer; color: var(--text-main); }
    .logo span { color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; border-radius: 4px; margin-right: 5px; }

    nav {
      display: flex;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      background: rgba(0,0,0,0.25);
      overflow-x: auto;
    }
    nav button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    nav button.active { background: var(--accent); color: #052e16; font-weight: 700; }

    /* Układ 3D kokpitu */
    .spatial-stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 2rem;
      padding: 2rem 3rem;
      perspective: 1600px;
      align-items: center;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .panel-3d {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.8rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 0 25px var(--accent-glow);
      transition: transform 0.4s ease;
    }

    .panel-left { transform: rotateY(10deg); }
    .panel-right { transform: rotateY(-10deg); }
    .panel-left:hover { transform: rotateY(3deg) translateZ(10px); }
    .panel-right:hover { transform: rotateY(-3deg) translateZ(10px); }

    h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin-bottom: 1rem; }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-card span { color: var(--text-muted); font-size: 0.8rem; }
    .stat-card strong { color: var(--text-main); font-size: 0.9rem; }

    .mini-chart {
      height: 35px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      border: 1px solid rgba(74,222,128,0.2);
      margin-top: 0.4rem;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .chart-line { stroke: var(--accent); fill: rgba(74,222,128,0.1); }

    .btn-action {
      margin-top: 0.6rem;
      width: 100%;
      padding: 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: rgba(74, 222, 128, 0.12);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-action:active { background: var(--accent); color: #052e16; }

    /* Style dla Marketplace */
    .market-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      width: 100%;
    }
    .market-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.2s;
    }
    .market-card:hover { border-color: var(--accent); background: rgba(74, 222, 128, 0.05); }

    #toast {
      position: fixed;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #052e16;
      padding: 0.6rem 1.2rem; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700;
      display: none; z-index: 200;
    }

    @media (max-width: 1024px) {
      .spatial-stage { grid-template-columns: 1fr; padding: 1rem; perspective: none; }
      .panel-left, .panel-right { transform: none !important; }
      .market-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo" onclick="app.switchTab('profile')"><span>TGN</span> GLOBAL GOLF</div>
      <button id="installBtn" class="btn-action" style="display:none; width:auto; margin:0;">Zainstaluj PWA</button>
    </div>
    <nav id="mainNav">
      <button class="active" data-tab="profile" onclick="app.switchTab('profile')">👤 Profil 3D</button>
      <button data-tab="marketplace" onclick="app.switchTab('marketplace')">🤝 Marketplace C2C</button>
      <button data-tab="forum" onclick="app.switchTab('forum')">💬 Forum</button>
      <button data-tab="sklep" onclick="app.switchTab('sklep')">🛍️ Sklep</button>
    </nav>
  </header>

  <main class="spatial-stage" id="appContainer">
    <!-- Dynamiczny widok 3D -->
  </main>

  <div id="toast">Powiadomienie</div>

  <script>
    const AppData = {
      user: {
        name: "Marek Kowalski",
        hcp: 12.4,
        level: "Średniozaawansowany",
        city: "Warszawa",
        lastRound: "82 (Sobota)",
        swingSpeed: "96 mph"
      },
      bag: [
        { name: "DRIVER: TAYLOR MADE Qi10", loft: "10.5°, Shaft: VENTUS Blue 6S", val: "1 800 PLN", speed: "145 mph", smash: "1.48", attack: "+3°", cond: "9/10" },
        { name: "IRON: MIZUNO JPX 923", loft: "7-Iron, Steel Shaft DG 105 S", val: "3 400 PLN", speed: "118 mph", spin: "6500 RPM", cond: "9.5/10" },
        { name: "PUTTER: ODYSSEY AI-ONE #7", loft: "34\", Grip: SUPERSTROKE", val: "1 200 PLN", cond: "Mint" }
      ],
      marketplace: [
        { title: "Wilson Dynapower Driver", seller: "Janusz_G (HCP 14)", price: "1 150 PLN", cond: "Stan: 9/10", desc: "Znakomity driver, regular flex, mało używany." },
        { title: "Zestaw Ironów Titleist T200 (5-PW)", seller: "Kamil_Golf (HCP 8.2)", price: "3 890 PLN", cond: "Stan: 8.5/10", desc: "Shaft Project X IO Stiff. Kute, świetny czucie." },
        { title: "Putter Scotty Cameron Special Select", seller: "Bartek_W (HCP 11)", price: "1 450 PLN", cond: "Stan: Mint", desc: "Model Newport 2, długość 34 cali z nowym gripem." },
        { title: "Wedge Vokey SM9 (56° / 10S)", seller: "Piotr_T (HCP 15)", price: "450 PLN", cond: "Stan: 7.5/10", desc: "Bruzdy wciąż bardzo oczne, wykończenie Tour Chrome." }
      ]
    };

    // Komponent profilu 3D
    const ProfileComponent = {
      render: () => `
        <section class="panel-3d panel-left">
          <h2>Profil Gracza: ${AppData.user.name} 🇵🇱</h2>
          
          <div style="display: flex; gap: 1.2rem; align-items: center; margin-bottom: 1.2rem; background: rgba(0,0,0,0.25); padding: 1rem; border-radius: 12px;">
            <div style="width: 85px; height: 110px; background: linear-gradient(135deg, #4ade80, #064e3b); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #052e16; font-size: 1.5rem; border: 1px solid var(--accent);">
              MK
            </div>
            <div>
              <p style="font-size: 0.8rem; color: var(--text-muted);">Handicap Index</p>
              <strong style="font-size: 1.2rem; color: var(--accent);">${AppData.user.hcp}</strong>
              <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem;">Poziom: <strong>${AppData.user.level}</strong></p>
              <p style="font-size: 0.75rem; color: var(--text-muted);">Lokalizacja: <strong>${AppData.user.city}</strong></p>
            </div>
          </div>

          <div class="stat-card">
            <span>Ostatnia Runda</span>
            <strong>${AppData.user.lastRound}</strong>
          </div>

          <div class="stat-card" style="flex-direction: column; align-items: flex-start;">
            <div style="display:flex; justify-content:space-between; width:100%;">
              <span>Średnia Prędkość Swingu</span>
              <strong>${AppData.user.swingSpeed}</strong>
            </div>
            <div class="mini-chart" style="width:100%;">
              <svg viewBox="0 0 100 30" width="100%" height="30">
                <path class="chart-line" d="M0,25 Q25,10 50,18 T100,5" fill="none" stroke-width="2"/>
              </svg>
            </div>
          </div>

          <div class="stat-card" style="border-color: var(--gold);">
            <div>
              <span style="color: var(--gold); font-weight: 700;">⚠️ Gapping AI: Sprawdź Gap Wedge</span>
              <p style="font-size: 0.7rem; color: var(--text-muted);">Wykryto lukę 15m między Pitchingiem a Sand Wedge.</p>
            </div>
            <button class="btn-action" style="width: auto; padding: 0.3rem 0.8rem;" onclick="app.showToast('Optymalizacja Gap Wedge w toku...')">Analizuj</button>
          </div>
        </section>
      `
    };

    // Komponent cyfrowej torby
    const BagComponent = {
      render: () => {
        let clubsHTML = AppData.bag.map(c => `
          <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 0.8rem; margin-bottom: 0.8rem;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <h3 style="font-size: 0.9rem; color: var(--accent);">${c.name}</h3>
                <p style="font-size: 0.75rem; color: var(--text-muted);">${c.loft}</p>
              </div>
              <span style="font-size: 0.75rem; background:rgba(74,222,128,0.15); color:var(--accent); padding:2px 6px; border-radius:4px;">Stan: ${c.cond}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.75rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.4rem;">
              <span>Wartość: <strong>${c.val}</strong></span>
              <span>Prędkość: <strong>${c.speed || 'N/A'}</strong></span>
            </div>
          </div>
        `).join('');

        return `
          <section class="panel-3d panel-right">
            <h2>Moja Torba: Cyfrowa Kopia (14/14 kijów)</h2>
            ${clubsHTML}
            <div style="background: rgba(0,0,0,0.3); padding: 0.9rem; border-radius: 12px; text-align: center; margin-top: 1rem;">
              <p style="font-size: 0.75rem; color: var(--text-muted);">CAŁKOWITA WARTOŚĆ TORBY</p>
              <strong style="font-size: 1.3rem; color: var(--accent);">14 200 PLN</strong>
              <button class="btn-action" onclick="app.showToast('Przekierowanie do Skupu TGN CPO...')">⚡ SPRZEDAJ NATYCHMIAST DO SKUPU TGN CPO</button>
              <button class="btn-action" style="background: rgba(250,204,21,0.1); border-color: var(--gold); color: var(--gold);" onclick="app.showToast('Trade-In wygenerowany!')">🔄 TRADE-IN NA NOWY MODEL 2026</button>
            </div>
          </section>
        `;
      }
    };

    // Nowy Komponent: Marketplace C2C
    const MarketplaceComponent = {
      render: () => {
        let itemsHTML = AppData.marketplace.map(item => `
          <div class="market-card">
            <div>
              <span style="font-size: 0.7rem; color: var(--gold); font-weight: 700;">${item.cond}</span>
              <h3 style="font-size: 0.95rem; margin: 0.3rem 0; color: var(--text-main);">${item.title}</h3>
              <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.6rem;">${item.desc}</p>
            </div>
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <span style="font-size: 0.7rem; color: var(--text-muted);">Od: ${item.seller}</span>
                <strong style="font-size: 1rem; color: var(--accent);">${item.price}</strong>
              </div>
              <button class="btn-action" onclick="app.showToast('Otwarto czat z graczem: ${item.seller}')">Napisz do sprzedawcy</button>
            </div>
          </div>
        `).join('');

        return `
          <section class="panel-3d" style="grid-column: span 2;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
              <h2>🤝 TGN Marketplace (C2C – Oferty Społecznościowe)</h2>
              <button class="btn-action" style="width: auto; padding: 0.4rem 1rem; margin: 0;" onclick="app.showToast('Formularz dodawania ogłoszenia...')">+ Wystaw swój sprzęt</button>
            </div>
            <div class="market-grid">
              ${itemsHTML}
            </div>
          </section>
        `;
      }
    };

    // Główny router i aplikacja
    const app = {
      switchTab: (tabName) => {
        const container = document.getElementById('appContainer');
        
        if (tabName === 'profile') {
          container.innerHTML = ProfileComponent.render() + BagComponent.render();
        } else if (tabName === 'marketplace') {
          container.innerHTML = MarketplaceComponent.render();
        } else if (tabName === 'forum') {
          container.innerHTML = `<section class="panel-3d" style="grid-column: span 2;"><h2>Strefa Forum TGN</h2><p style="color:var(--text-muted); margin-top:0.5rem;">Dyskusje, Custom Fitting i sekcje lokalne.</p></section>`;
        } else if (tabName === 'sklep') {
          container.innerHTML = `<section class="panel-3d" style="grid-column: span 2;"><h2>Sklep TGN & Sprzęt oficjalny</h2><p style="color:var(--text-muted); margin-top:0.5rem;">Oficjalny sprzęt 2026 i gwarancja producenta.</p></section>`;
        }

        document.querySelectorAll('#mainNav button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tabName);
        });
      },

      showToast: (msg) => {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      app.switchTab('profile');
    });
  </script>
</body>
</html>
