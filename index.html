<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070f14">
  <title>TGN Global Golf - Spatial 3D PWA</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/spatial-3d.css">
</head>
<body>

  <!-- Górna nawigacja -->
  <header>
    <div class="header-top">
      <div class="logo" onclick="app.switchTab('profile')"><span>TGN</span> GLOBAL GOLF</div>
      <button id="installBtn" class="btn-install" style="display:none;">Zainstaluj PWA</button>
    </div>
    <nav id="mainNav">
      <button class="active" data-tab="profile" onclick="app.switchTab('profile')">👤 Profil 3D</button>
      <button data-tab="forum" onclick="app.switchTab('forum')">💬 Forum</button>
      <button data-tab="sklep" onclick="app.switchTab('sklep')">🛍️ Sklep</button>
    </nav>
  </header>

  <!-- Dynamiczna scena 3D / kontener widoków -->
  <main class="spatial-stage" id="appContainer">
    <!-- Komponenty ładują się dynamicznie przez JS -->
  </main>

  <div id="toast">Powiadomienie</div>

  <!-- Modułowe skrypty -->
  <script src="./js/data.js"></script>
  <script src="./components/profile.js"></script>
  <script src="./components/bag.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
