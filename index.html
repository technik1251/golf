<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070f14">
  <title>TGN Global Golf - Spatial 3D PWA</title>
  <style>
    :root {
      --glass-bg: rgba(18, 32, 36, 0.88);
      --glass-border: rgba(114, 214, 150, 0.35);
      --accent: #4ade80;
      --accent-glow: rgba(74, 222, 128, 0.2);
      --gold: #facc15;
      --blue: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      color: var(--text-main);
      background: radial-gradient(circle at 50% 40%, rgba(20, 60, 40, 0.55), rgba(7, 15, 20, 0.96)),
                  url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(10, 20, 24, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
    }

    .logo { font-weight: 800; font-size: 1rem; cursor: pointer; color: var(--text-main); }
    .logo span { color: var(--accent); border: 1px solid var(--accent); padding: 1px 5px; border-radius: 4px; margin-right: 5px; }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-logout:hover { background: rgba(239, 68, 68, 0.3); color: #fff; }

    nav {
      display: flex;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      background: rgba(0,0,0,0.25);
      overflow-x: auto;
    }
    nav button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    nav button:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    nav button.active { background: var(--accent); color: #052e16; font-weight: 700; }

    /* Ekran Logowania 3D */
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      perspective: 1400px;
    }

    .auth-panel {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 2rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.75), inset 0 0 25px var(--accent-glow);
      transform: rotateX(2deg);
      transition: transform 0.3s ease;
    }
    .auth-panel:hover { transform: rotateX(0deg) translateZ(8px); }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(0, 0, 0, 0.35);
      padding: 0.3rem;
      border-radius: 10px;
      margin-bottom: 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .auth-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
      transition: 0.2s;
    }
    .auth-tab-btn.active {
      background: var(--accent);
      color: #052e16;
    }

    .form-group { margin-bottom: 0.9rem; }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 0.35rem;
    }
    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent);
      background: rgba(74, 222, 128, 0.06);
    }

    .btn-primary {
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #052e16;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 0.4rem;
      transition: 0.2s;
    }
    .btn-primary:hover { filter: brightness(1.08); }

    .btn-demo {
      width: 100%;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background: rgba(250, 204, 21, 0.1);
      color: var(--gold);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      margin-top: 0.75rem;
    }
    .btn-demo:hover { background: rgba(250, 204, 21, 0.2); }

    /* Układ 3D kokpitu po zalogowaniu */
    .spatial-stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 2rem;
      padding: 2rem 3rem;
      perspective: 1600px;
      align-items: start;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .panel-3d {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.8rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 0 25px var(--accent-glow);
      transition: transform 0.4s ease;
    }

    .panel-left { transform: rotateY(10deg); }
    .panel-right { transform: rotateY(-10deg); }
    .panel-left:hover { transform: rotateY(3deg) translateZ(10px); }
    .panel-right:hover { transform: rotateY(-3deg) translateZ(10px); }

    h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin-bottom: 1rem; }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-card span { color: var(--text-muted); font-size: 0.8rem; }
    .stat-card strong { color: var(--text-main); font-size: 0.9rem; }

    .mini-chart {
      height: 35px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      border: 1px solid rgba(74,222,128,0.2);
      margin-top: 0.4rem;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    .chart-line { stroke: var(--accent); fill: rgba(74,222,128,0.1); }

    .btn-action {
      margin-top: 0.6rem;
      width: 100%;
      padding: 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: rgba(74, 222, 128, 0.12);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .btn-action:active { background: var(--accent); color: #052e16; }

    /* Forum */
    .forum-stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.9rem;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    .forum-stat-num { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
    .forum-stat-lbl { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .forum-filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .filter-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .filter-pill.active, .filter-pill:hover {
      background: rgba(74, 222, 128, 0.18);
      border-color: var(--accent);
      color: var(--accent);
    }

    .forum-post-card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }
    .forum-post-card.pinned {
      border-color: rgba(250, 204, 21, 0.45);
      background: linear-gradient(145deg, rgba(250, 204, 21, 0.05), rgba(255, 255, 255, 0.03));
    }

    .post-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
    }
    .user-badge {
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 4px;
    }
    .badge-og { background: rgba(56, 189, 248, 0.15); color: var(--blue); border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-pro { background: rgba(250, 204, 21, 0.15); color: var(--gold); border: 1px solid rgba(250, 204, 21, 0.4); }
    .badge-vet { background: rgba(74, 222, 128, 0.15); color: var(--accent); border: 1px solid rgba(74, 222, 128, 0.4); }

    .post-metrics {
      display: flex;
      gap: 1rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 0.7rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .comment-box {
      background: rgba(0, 0, 0, 0.32);
      border-left: 3px solid var(--accent);
      padding: 0.75rem 0.9rem;
      border-radius: 0 8px 8px 0;
      margin-top: 0.55rem;
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
      font-size: 0.72rem;
    }

    .new-thread-box {
      display: none;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.2rem;
    }
    .new-thread-box input, .new-thread-box select, .new-thread-box textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 0.55rem;
      color: #fff;
      font-size: 0.8rem;
      margin-bottom: 0.6rem;
      outline: none;
    }

    /* Skup CPO & Marketplace & Czat */
    .cpo-grid { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
    .cpo-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: 100%; }
    .market-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 400px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .msg { max-width: 80%; padding: 0.7rem 0.9rem; border-radius: 10px; font-size: 0.8rem; line-height: 1.4; }
    .msg.incoming { background: rgba(255, 255, 255, 0.08); align-self: flex-start; }
    .msg.outgoing { background: rgba(74, 222, 128, 0.2); border: 1px solid var(--glass-border); align-self: flex-end; color: var(--accent); }
    .chat-input-area {
      display: flex;
      padding: 0.75rem;
      background: rgba(10, 20, 24, 0.8);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      gap: 0.5rem;
    }
    .chat-input-area input {
      flex: 1; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px; padding: 0.6rem 0.9rem; color: #fff; font-size: 0.8rem; outline: none;
    }
    .chat-input-area button { background: var(--accent); color: #052e16; border: none; padding: 0 1.2rem; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

    #toast {
      position: fixed;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #052e16;
      padding: 0.6rem 1.2rem; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700;
      display: none; z-index: 200;
    }

    @media (max-width: 1024px) {
      .spatial-stage { grid-template-columns: 1fr; padding: 1rem; perspective: none; }
      .panel-left, .panel-right { transform: none !important; }
      .market-grid { grid-template-columns: 1fr; }
      .forum-stats-bar { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Pasek górny (widoczny zawsze, menu tylko po zalogowaniu) -->
  <header>
    <div class="header-top">
      <div class="logo" id="logoBtn"><span>TGN</span> GLOBAL GOLF</div>
      <div id="headerRightInfo" style="display:flex; align-items:center; gap:0.75rem;">
        <span style="font-size: 0.7rem; color: var(--text-muted);">Est. 2021 • Spatial PWA</span>
      </div>
    </div>
    <nav id="mainNav" style="display:none;">
      <button class="active" data-tab="profile">👤 Profil 3D</button>
      <button data-tab="forum">💬 Forum & Poradniki</button>
      <button data-tab="cpo">⚡ Skup TGN CPO</button>
      <button data-tab="marketplace">🤝 Marketplace</button>
      <button data-tab="chat">💬 Czat</button>
    </nav>
  </header>

  <!-- Ekran Logowania / Rejestracji -->
  <div id="authScreen" class="auth-wrapper">
    <div class="auth-panel">
      <div style="text-align: center; margin-bottom: 1.2rem;">
        <div style="font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px;">
          <span style="color: var(--accent); border: 1px solid var(--accent); padding: 2px 7px; border-radius: 5px; margin-right: 6px;">TGN</span>ID PORTAL
        </div>
        <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.4rem;">Zaloguj się do swojego kokpitu golfowego 3D</p>
      </div>

      <div class="auth-tabs">
        <button id="tabLoginBtn" class="auth-tab-btn active" onclick="auth.switchAuthMode('login')">Logowanie</button>
        <button id="tabRegisterBtn" class="auth-tab-btn" onclick="auth.switchAuthMode('register')">Rejestracja</button>
      </div>

      <!-- Formularz Logowania -->
      <div id="loginForm">
        <div class="form-group">
          <label>Adres E-mail lub Login TGN</label>
          <input type="email" id="loginEmail" placeholder="np. marek@tgngolf.pl" value="marek.kowalski@tgngolf.pl">
        </div>
        <div class="form-group">
          <label>Hasło</label>
          <input type="password" id="loginPass" placeholder="••••••••" value="********">
        </div>
        <button class="btn-primary" onclick="auth.handleLogin()">Zaloguj się do kokpitu 3D</button>
        <button class="btn-demo" onclick="auth.loginDemo()">⚡ Szybkie logowanie Demo (Marek Kowalski • HCP 12.4)</button>
      </div>

      <!-- Formularz Rejestracji -->
      <div id="registerForm" style="display:none;">
        <div class="form-group">
          <label>Imię i Nazwisko</label>
          <input type="text" id="regName" placeholder="np. Jan Nowak">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;">
          <div class="form-group">
            <label>Aktualny HCP</label>
            <input type="number" step="0.1" id="regHcp" placeholder="np. 18.5" value="24.0">
          </div>
          <div class="form-group">
            <label>Miasto / Klub</label>
            <input type="text" id="regCity" placeholder="np. Szczecin" value="Warszawa">
          </div>
        </div>
        <div class="form-group">
          <label>Adres E-mail</label>
          <input type="email" id="regEmail" placeholder="twoj@email.pl">
        </div>
        <div class="form-group">
          <label>Hasło</label>
          <input type="password" id="regPass" placeholder="Minimum 6 znaków">
        </div>
        <button class="btn-primary" onclick="auth.handleRegister()">Utwórz Profil TGN & Cyfrową Torbę</button>
      </div>
    </div>
  </div>

  <!-- Główna scena aplikacji (ukryta przed zalogowaniem) -->
  <main class="spatial-stage" id="appContainer" style="display:none;">
    <!-- Dynamiczny widok -->
  </main>

  <div id="toast">Powiadomienie</div>

        const text = input ? input.value.trim() : '';
        if (!text) return;

        const post = AppData.forumPosts.find(p => p.id === postId);
        if (post) {
          post.comments.push({
            author: AppData.user.name,
            badge: "HCP " + AppData.user.hcp,
            badgeClass: "badge-vet",
            date: "Przed chwilą",
            text: text
          });
          app.switchTab('forum');
          app.showToast('Dodano odpowiedź do wątku!');
        }
      },

      openChat: (sellerName) => {
        app.switchTab('chat');
        app.showToast('Otwarto czat z: ' + sellerName);
      },

      sendChatMessage: () => {
        const input = document.getElementById('chatInput');
        if (!input || !input.value.trim()) return;

        AppData.chatMessages.push({ sender: AppData.user.name, text: input.value.trim(), type: "outgoing" });
        input.value = '';
        
        document.getElementById('appContainer').innerHTML = ChatComponent.render();
        app.scrollChatToBottom();

        setTimeout(() => {
          AppData.chatMessages.push({ sender: "Janusz_G", text: "Brzmi super! Daj znać kiedy pasuje Ci runda.", type: "incoming" });
          const activeBtn = document.querySelector('#mainNav button.active');
          if (activeBtn && activeBtn.dataset.tab === 'chat') {
            document.getElementById('appContainer').innerHTML = ChatComponent.render();
            app.scrollChatToBottom();
          }
        }, 1200);
      },

      scrollChatToBottom: () => {
        const box = document.getElementById('chatMsgs');
        if (box) box.scrollTop = box.scrollHeight;
      },

      showToast: (msg) => {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('#mainNav button').forEach(btn => {
        btn.addEventListener('click', () => {
          app.switchTab(btn.dataset.tab);
        });
      });

      const logoBtn = document.getElementById('logoBtn');
      if (logoBtn) {
        logoBtn.addEventListener('click', () => {
          if (localStorage.getItem('tgn_user')) {
            app.switchTab('profile');
          }
        });
      }

      // Sprawdź czy użytkownik był już zalogowany
      const savedSession = localStorage.getItem('tgn_user');
      if (savedSession) {
        AppData.user = JSON.parse(savedSession);
        auth.enterApp();
      }
    });
  </script>
</body>
</html>
